<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntervAI Buddy</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        color: #111827;
        width: 360px;
        min-height: 420px;
      }
      .wrap {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #374151;
      }
      input, textarea, button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #dbe1ea;
        font-size: 14px;
      }
      input, textarea {
        padding: 10px 12px;
        background: white;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      button {
        cursor: pointer;
        padding: 10px 12px;
        background: #2563eb;
        color: white;
        border: none;
        font-weight: 700;
        margin-top: 10px;
      }
      button.secondary {
        background: #111827;
      }
      .answer {
        margin-top: 14px;
        padding: 12px;
        background: white;
        border: 1px solid #dbe1ea;
        border-radius: 12px;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.5;
      }
      .muted {
        font-size: 12px;
        color: #4b5563;
        margin-top: 6px;
      }
      .error {
        color: #b91c1c;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>IntervAI Buddy</h1>
      <label for="role">Target role</label>
      <input id="role" type="text" placeholder="e.g. Frontend Engineer" />

      <label for="question" style="margin-top: 12px;">Question</label>
      <textarea id="question" placeholder="Ask for a model answer, a coaching tip, or interview help..."></textarea>

      <button id="ask">Ask Buddy</button>
      <button id="share-screen" class="secondary">Share my screen</button>
      <div class="muted" id="status">No active request yet.</div>
      <div class="muted" id="transcript" style="margin-top: 12px; min-height: 60px; white-space: pre-wrap; line-height: 1.5;">Transcript will appear here when your screen is shared.</div>
      <div id="answer" class="answer" hidden></div>
      <div id="error" class="error"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
